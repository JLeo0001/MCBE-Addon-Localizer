name: arc_localizer
description: "Minecraft Bedrock addon auto-localizer — Flutter port (Android + Windows)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^10.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.4.0

  http: ^1.2.0
  archive: ^4.0.0
  image: ^4.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
