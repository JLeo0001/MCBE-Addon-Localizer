name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签（留空则仅构建不发布）'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  android:
    name: Android (arm64-v8a / armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Two upstream outages to work around in CI only:
      #  * Gradle's distribution host answers 504 -> use a mirror
      #  * Maven Central redirects Kotlin artifacts to GitHub Releases, which
      #    also answers 504 -> replace repositories with a directly-serving mirror
      - name: Work around Gradle / Maven outages
        run: |
          sed -i 's#services\.gradle\.org/distributions#mirrors.cloud.tencent.com/gradle#' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          settingsEvaluated { settings ->
              def pluginRepos = settings.pluginManagement.repositories
              pluginRepos.clear()
              pluginRepos.maven { url 'https://maven.aliyun.com/repository/google' }
              pluginRepos.maven { url 'https://maven.aliyun.com/repository/central' }
              pluginRepos.maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }

              def depRepos = settings.dependencyResolutionManagement.repositories
              depRepos.clear()
              depRepos.maven { url 'https://maven.aliyun.com/repository/google' }
              depRepos.maven { url 'https://maven.aliyun.com/repository/central' }
          }
          EOF
          cat ~/.gradle/init.gradle

      - name: Build split APKs
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi; then
              echo "build succeeded on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          echo "build failed after 3 attempts"
          exit 1

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/mcbe-localizer-armv8.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/mcbe-localizer-armv7.apk
          ls -lh dist

      - name: Verify APK signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs dist/mcbe-localizer-armv8.apk | tee /tmp/certs.txt
          if grep -qi "Android Debug" /tmp/certs.txt; then
            echo "::warning::APK signed with debug key (keystore not applied)"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "Windows build output not found: $src" }
          Compress-Archive -Path "$src\*" -DestinationPath "mcbe-localizer-windows-x64.zip" -Force
          Get-Item "mcbe-localizer-windows-x64.zip" | Format-List Name,Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: mcbe-localizer-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, windows]
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dist

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MCBE 附加包本地化工具 ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/mcbe-localizer-armv8.apk
            dist/mcbe-localizer-armv7.apk
            dist/mcbe-localizer-windows-x64.zip
          body: |
            ## 构建产物

            | 文件 | 平台 | 说明 |
            |:---|:---|:---|
            | `mcbe-localizer-armv8.apk` | Android arm64-v8a | 64 位设备（2017 年后机型） |
            | `mcbe-localizer-armv7.apk` | Android armeabi-v7a | 32 位老旧设备 |
            | `mcbe-localizer-windows-x64.zip` | Windows x64 | 解压后运行 `mcbe-localizer.exe` |

            ## 说明

            - 由 GitHub Actions 使用 Flutter ${{ env.FLUTTER_VERSION }} 构建
            - Android 包使用仓库内的 release keystore 签名，可直接覆盖安装
            - 本项目为独立项目，遵循 MIT 许可
